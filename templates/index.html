<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Live Cluster Dashboard</title>
    <!-- Socket.IO CDN Library -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 30px; color: #38bdf8; text-align: center; }
        .grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            min-width: 180px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        .card h3 { margin: 0 0 10px 0; color: #94a3b8; font-size: 1.1rem; }
        .card p { font-size: 2.2rem; font-weight: bold; margin: 0; color: #4ade80; }
    </style>
</head>
<body>

    <h1>Realtime DevOps Cluster Dashboard</h1>

    <div class="grid">
        <div class="card">
            <h3>CPU Usage</h3>
            <p id="cpu">0%</p>
        </div>
        <div class="card">
            <h3>Memory Usage</h3>
            <p id="memory">0%</p>
        </div>
        <div class="card">
            <h3>Active Pods</h3>
            <p id="active_pods">0</p>
        </div>
    </div>

    <!-- SOCKET.IO LISTENER CODE -->
    <script>
        // Server se Socket.IO connection establish kar rahe hain
        const socket = io();

        // Python backend se 'system_metrics' event ka listener
        socket.on('system_metrics', function(data) {
            document.getElementById('cpu').innerText = data.cpu + '%';
            document.getElementById('memory').innerText = data.memory + '%';
            document.getElementById('active_pods').innerText = data.active_pods;
        });
    </script>
</body>
</html>
